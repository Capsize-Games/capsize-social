[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsize-social"
version = "0.1.0"
description = "Decoupled social-account connections: credential storage and posting/sending actions for Bluesky and Discord, over HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Capsize LLC", email = "contact@capsizegames.com" },
]
keywords = [
    "bluesky",
    "discord",
    "social-media",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "capsize-bluesky>=0.1.0",
    # Shared Capsize library: settings base, SQLAlchemy conventions,
    # API-key auth. Consumed from git until it is on an index.
    "capsize-commons[config,db,web]>=0.1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
capsize-social = "capsize_social.__main__:main"

[project.urls]
Homepage = "https://github.com/capsize-games/capsize-social"
Issues = "https://github.com/capsize-games/capsize-social/issues"

[tool.setuptools.packages.find]
include = ["capsize_social*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
capsize-bluesky = { path = "../capsize-bluesky", editable = true }
