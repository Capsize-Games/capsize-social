name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # This private repository uses the workstation queue and its scoped runner.
    runs-on: [self-hosted, Linux, X64, capsize-social-ci]
    env:
      PATH: /home/joe/.local/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          uv venv .venv
          uv pip install --no-sources --python .venv/bin/python \
            "capsize-bluesky @ git+https://github.com/Capsize-Games/capsize-bluesky.git@main" \
            -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check capsize_social tests migrations

      - name: Types
        run: .venv/bin/mypy capsize_social

      - name: Tests
        run: .venv/bin/pytest -q

      - name: Build
        run: uv build
